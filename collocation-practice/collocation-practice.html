eft:7px}.idot.done{background:var(--green)}.main{min-width:0}.card{padding:28px}.kicker{font-size:13px;color:var(--muted);letter-spacing:.02em}.phrase{font-size:30px;font-weight:900;color:var(--red);margin:6px 0 9px;line-height:1.15}.meaning{font-size:17px;font-weight:700}.infoGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.info{background:var(--soft);border:1px solid var(--line);border-radius:15px;padding:14px}.lab{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}.pattern{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;line-height:1.55}.example{margin-top:14px;background:var(--softred);border:1px solid #f0d8d4;border-radius:16px;padding:15px}.exEn{font-weight:750;line-height:1.55}.exCn{color:var(--muted);margin-top:5px}.rowBtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{padding:9px 13px}.btn.ghost{background:transparent}.trainTitle{margin:26px 0 10px;font-size:19px;font-weight:850}.steps{display:grid;gap:12px}.step{border:1px solid var(--line);border-radius:16px;padding:15px}.stephead{display:flex;justify-content:space-between;gap:10px}.stepname{font-weight:850}.hint{color:var(--muted);font-size:13px;margin-top:4px;line-height:1.55}.count{color:var(--muted);font-size:12px;white-space:nowrap}.step textarea{width:100%;min-height:104px;margin-top:10px;border:1px solid #d9d0c9;border-radius:12px;padding:12px 13px;font:16px/1.55 inherit;resize:vertical;outline:none}.step textarea:focus{border-color:#9a7b6b;box-shadow:0 0 0 3px rgba(154,123,107,.1)}.navrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px;border-top:1px solid var(--line);padding-top:16px}.right{position:sticky;top:83px;height:max-content;padding:18px}.statrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:var(--soft);border-radius:14px;padding:13px;text-align:center}.stat b{display:block;font-size:23px}.progress{height:9px;background:#ece7e2;border-radius:99px;overflow:hidden;margin:12px 0}.fill{height:100%;background:var(--red);width:0}.right h3{margin:8px 0 12px}.tiny{font-size:13px;color:var(--muted);line-height:1.55}.hidden{display:none!important}.export{display:none}.export.active{display:block}.exportWrap{max-width:1100px;margin:22px auto;padding:0 22px}.exportCard{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:var(--shadow)}.promptBox{white-space:pre-wrap;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:16px;font-size:14px;line-height:1.6;max-height:280px;overflow:auto}.answers{margin-top:16px;display:grid;gap:10px}.answer{border:1px solid var(--line);border-radius:14px;padding:14px}.answer strong{color:var(--red)}.empty{padding:40px;text-align:center;color:var(--muted)}.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);opacity:0;background:#1f1e1c;color:white;padding:10px 16px;border-radius:999px;transition:.2s;z-index:99}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1050px){.layout{grid-template-columns:240px minmax(0,1fr)}.right{display:none}.infoGrid{grid-template-columns:1fr}}@media(max-width:760px){.topin{padding:12px}.brand{font-size:16px}.layout{display:block;padding:0 12px;margin:12px auto}.side{position:relative;top:auto;height:auto;margin-bottom:12px}.list{max-height:250px}.card{padding:18px;border-radius:18px}.phrase{font-size:25px}.tabs .tab{padding:8px 11px}.exportWrap{padding:0 12px}.infoGrid{grid-template-columns:1fr}.navrow .btn{flex:1}}

<header class="top"><div class="topin"><div class="brand"><b>Ambergris</b> · Collocation Lab</div><div class="tabs"><button id="tabStudy" class="tab active">造句练习</button><button id="tabAI" class="tab">AI 批改稿</button></div></div></header>

</div></section>

<script>const DATA=[{"id": 1, "paragraph": "A", "local": 1, "phrase": "refer to A as B", "cn": "把 A 称为 B", "usage": "正式且高频；适合定义术语、概念、现象。", "pattern": "主语 + refer(s) to + A + as + B", "example": "Researchers often refer to this pattern as a self-reinforcing cycle.", "exampleCn": "研究人员常把这种模式称为“自我强化循环”。"}, {"id": 2, "paragraph": "A", "local": 2, "phrase": "be highly prized for", "cn": "因……而备受珍视", "usage": "强调某物因某种特性、价值或功能而受到重视。", "pattern": "主语 + be + highly prized for + 名词 / 动名词", "example": "This wood is highly prized for its strength and durability.", "exampleCn": "这种木材因坚固耐用而备受珍视。"}, {"id": 3, "paragraph": "A", "local": 3, "phrase": "medicinal properties", "cn": "药用性质；药用功效", "usage": "property 在此为“性质、特性”，常见于学术说明文。", "pattern": "主语 + have / possess / be studied for + medicinal properties", "example": "The plant has long been studied for its medicinal properties.", "exampleCn": "这种植物长期以来因其药用性质而受到研究。"}, {"id": 4, "paragraph": "A", "local": 4, "phrase": "be widely used as", "cn": "被广泛用作……", "usage": "说明某物的普遍用途。", "pattern": "主语 + be + widely used as + 名词", "example": "Solar panels are widely used as a source of renewable energy.", "exampleCn": "太阳能板被广泛用作可再生能源来源。"}, {"id": 5, "paragraph": "A", "local": 5, "phrase": "be believed to be", "cn": "被认为是……", "usage": "只表示一种观点或认知，不等于“被证实”。", "pattern": "主语 + be + believed to be + 名词 / 形容词", "example": "The site is believed to be more than two thousand years old.", "exampleCn": "人们认为这个遗址已有两千多年的历史。"}, {"id": 6, "paragraph": "A", "local": 6, "phrase": "be added to", "cn": "被添加到……中", "usage": "常用于食品、材料、化学过程等语境。", "pattern": "主语 + be + added to + 名词", "example": "A small amount of salt is added to the mixture.", "exampleCn": "混合物中会加入少量盐。"}, {"id": 7, "paragraph": "A", "local": 7, "phrase": "be highly valued as", "cn": "作为……而受到高度重视", "usage": "强调某物作为某种用途或身份的价值。", "pattern": "主语 + be + highly valued as + 名词", "example": "Critical thinking is highly valued as a workplace skill.", "exampleCn": "批判性思维作为一项职场技能受到高度重视。"}, {"id": 8, "paragraph": "A", "local": 8, "phrase": "in the making of", "cn": "在……的制作过程中", "usage": "可替换为 in the production/manufacture of。", "pattern": "主语 + be used / involved + in the making of + 名词", "example": "Natural dyes are still used in the making of traditional textiles.", "exampleCn": "天然染料仍被用于传统纺织品的制作过程中。"}, {"id": 9, "paragraph": "A", "local": 9, "phrase": "enable A to do B", "cn": "使 A 能够做 B", "usage": "雅思写作非常实用，可替换 allow A to do B。", "pattern": "主语 + enable(s) + A + to do + B", "example": "Digital tools enable students to access information more quickly.", "exampleCn": "数字工具使学生能够更快获取信息。"}, {"id": 10, "paragraph": "A", "local": 10, "phrase": "retain its fragrance", "cn": "保持其香味", "usage": "retain = keep/maintain，正式程度更高。", "pattern": "主语 + retain(s) its fragrance + 时间 / 条件", "example": "The oil can retain its fragrance for several hours.", "exampleCn": "这种精油可以保持香味数小时。"}, {"id": 11, "paragraph": "A", "local": 11, "phrase": "in the form of", "cn": "以……的形式", "usage": "描述表现形式、存在形式、提供方式。", "pattern": "主语 + be provided / appear / exist + in the form of + 名词", "example": "Financial support may be provided in the form of grants.", "exampleCn": "经济支持可以以补助金的形式提供。"}, {"id": 12, "paragraph": "A", "local": 12, "phrase": "be washed up on the shore", "cn": "被海浪冲上岸", "usage": "也可说 wash ashore。", "pattern": "主语 + be + washed up on the shore + 时间 / 原因", "example": "Plastic waste is often washed up on the shore after storms.", "exampleCn": "暴风雨后，塑料垃圾经常被冲上海岸。"}, {"id": 13, "paragraph": "A", "local": 13, "phrase": "be worth one's/its weight in gold", "cn": "极其珍贵；非常有价值", "usage": "既可按字面，也可比喻“价值极高”。", "pattern": "主语 + be + worth + one's/its weight in gold", "example": "A reliable translator can be worth their weight in gold during negotiations.", "exampleCn": "在谈判中，一名可靠的翻译可能极其宝贵。"}, {"id": 14, "paragraph": "B", "local": 1, "phrase": "be known to sb as", "cn": "被某人称为……；对某人而言被称作……", "usage": "用于说明不同群体对同一事物的称呼。", "pattern": "主语 + be + known to + 人 / 群体 + as + 名称", "example": "The plant is known to local people as the “desert rose”.", "exampleCn": "当地人把这种植物称为“沙漠玫瑰”。"}, {"id": 15, "paragraph": "B", "local": 2, "phrase": "be originally called", "cn": "最初被称为……", "usage": "描述名称、术语的历史变化。", "pattern": "主语 + be + originally called + 名称", "example": "The city was originally called New Amsterdam.", "exampleCn": "这座城市最初被称为“新阿姆斯特丹”。"}, {"id": 16, "paragraph": "B", "local": 3, "phrase": "lead to further confusion", "cn": "导致进一步的混淆", "usage": "lead to + 名词/动名词；因果表达高频。", "pattern": "主语 + lead(s) to further confusion + about / over + 名词", "example": "Using two different definitions may lead to further confusion.", "exampleCn": "使用两种不同的定义可能导致进一步混淆。"}, {"id": 17, "paragraph": "B", "local": 4, "phrase": "in the popular mind", "cn": "在大众认知中", "usage": "用于概括普遍印象、社会认知。", "pattern": "In the popular mind, + 完整句", "example": "In the popular mind, success is often associated with wealth.", "exampleCn": "在大众认知中，成功常常与财富联系在一起。"}, {"id": 18, "paragraph": "B", "local": 5, "phrase": "be associated with", "cn": "与……有关联", "usage": "雅思阅读/写作高频；可表示客观关联或主观联想。", "pattern": "主语 + be + associated with + 名词 / 风险 / 现象", "example": "Regular exercise is associated with a lower risk of heart disease.", "exampleCn": "规律运动与较低的心脏病风险有关。"}, {"id": 19, "paragraph": "B", "local": 6, "phrase": "the most common source of", "cn": "……最常见的来源", "usage": "适合资源、问题、信息、污染、收入等语境。", "pattern": "主语 + be + the most common source of + 名词", "example": "Road traffic is the most common source of noise in many cities.", "exampleCn": "道路交通是许多城市最常见的噪音来源。"}, {"id": 20, "paragraph": "B", "local": 7, "phrase": "pour scorn on", "cn": "嘲讽；强烈鄙视", "usage": "较强烈、偏书面；常用于评论人物观点。", "pattern": "主语 + pour(s) scorn on + 观点 / 说法 / 人", "example": "The critic poured scorn on the claim that the policy had solved the problem.", "exampleCn": "这位评论家对“该政策已经解决问题”的说法大加嘲讽。"}, {"id": 21, "paragraph": "B", "local": 8, "phrase": "believe A to be B", "cn": "认为 A 是 B", "usage": "比 believe that... 更紧凑的书面结构。", "pattern": "主语 + believe(s) + A + to be + B", "example": "Many historians believe the document to be authentic.", "exampleCn": "许多历史学家认为这份文件是真实的。"}, {"id": 22, "paragraph": "B", "local": 9, "phrase": "be quite distinct from", "cn": "与……明显不同", "usage": "distinct from 是固定搭配，适合比较与分类。", "pattern": "主语 + be + quite distinct from + 比较对象", "example": "Online learning is quite distinct from traditional classroom teaching.", "exampleCn": "在线学习与传统课堂教学明显不同。"}, {"id": 23, "paragraph": "B", "local": 10, "phrase": "be largely used in", "cn": "主要用于……", "usage": "原文表达；现代写作中 often 可用 be mainly/widely used in。", "pattern": "主语 + be + largely used in + 领域 / 过程", "example": "The material is largely used in high-temperature industrial equipment.", "exampleCn": "这种材料主要用于高温工业设备。"}, {"id": 24, "paragraph": "C", "local": 1, "phrase": "by which time", "cn": "到那时为止", "usage": "承接前文时间点，常用于历史叙述。", "pattern": "时间点 + ..., by which time + 主语 + had + 过去分词", "example": "The project ended in 2018, by which time costs had doubled.", "exampleCn": "该项目于2018年结束，到那时成本已经翻了一倍。"}, {"id": 25, "paragraph": "C", "local": 2, "phrase": "be resolved by", "cn": "由……解决；被……弄清", "usage": "可用于 mystery/problem/dispute/question 等。", "pattern": "问题 / 争议 + be + resolved by + 人 / 方法 / 证据", "example": "The dispute was eventually resolved by an independent panel.", "exampleCn": "这场争议最终由一个独立小组解决。"}, {"id": 26, "paragraph": "C", "local": 3, "phrase": "accompany sb on", "cn": "陪同某人参加/前往……", "usage": "常见 accompany sb on a trip/voyage/visit。", "pattern": "主语 + accompany / accompanies + sb + on + trip / visit / voyage", "example": "She accompanied the research team on its expedition to Antarctica.", "exampleCn": "她陪同研究团队前往南极考察。"}, {"id": 27, "paragraph": "C", "local": 4, "phrase": "present a paper to", "cn": "向……提交/宣读论文", "usage": "学术场景常见；paper 指论文/研究报告。", "pattern": "主语 + present(s) a paper to + 机构 / 会议", "example": "The scientist presented a paper to the international conference.", "exampleCn": "这位科学家在国际会议上宣读了一篇论文。"}, {"id": 28, "paragraph": "C", "local": 5, "phrase": "conclusively prove that", "cn": "确凿地证明……", "usage": "conclusively 强调证据足以得出明确结论。", "pattern": "证据 / 研究 + conclusively prove(s) that + 完整句", "example": "The available evidence does not conclusively prove that the treatment is effective.", "exampleCn": "现有证据尚不能确凿证明这种治疗有效。"}, {"id": 29, "paragraph": "C", "local": 6, "phrase": "confirm an observation", "cn": "证实一项观察结果", "usage": "confirm 可搭配 finding/result/report/suspicion。", "pattern": "主语 + confirm(s) + an observation / finding + about ...", "example": "A later experiment confirmed the original observation.", "exampleCn": "后来的实验证实了最初的观察结果。"}, {"id": 30, "paragraph": "C", "local": 7, "phrase": "witness sb doing sth", "cn": "亲眼目睹某人正在做某事", "usage": "witness 作动词，强调亲历。", "pattern": "主语 + witness(es) + sb + doing sth", "example": "Several residents witnessed the river rising rapidly after the storm.", "exampleCn": "几名居民亲眼目睹暴风雨后河水迅速上涨。"}, {"id": 31, "paragraph": "C", "local": 8, "phrase": "have its origins in", "cn": "起源于……", "usage": "适合讨论制度、习俗、问题、现象的起源。", "pattern": "主语 + have / has its origins in + 来源 / 时期 / 传统", "example": "The festival has its origins in an ancient farming tradition.", "exampleCn": "这个节日起源于一种古老的农耕传统。"}, {"id": 32, "paragraph": "D", "local": 1, "phrase": "grow up to + 数字", "cn": "长到/达到……", "usage": "用于尺寸、长度、高度、重量等上限。", "pattern": "主语 + can grow up to + 数字 + 单位", "example": "Some bamboo species can grow up to thirty metres in height.", "exampleCn": "一些竹子品种可以长到30米高。"}, {"id": 33, "paragraph": "D", "local": 2, "phrase": "be based on", "cn": "以……为基础；基于……", "usage": "雅思高频，可用于研究、观点、故事、政策。", "pattern": "主语 + be + based on + 数据 / 证据 / 原则", "example": "The report is based on data collected from 2,000 households.", "exampleCn": "这份报告基于从2000个家庭收集的数据。"}, {"id": 34, "paragraph": "D", "local": 3, "phrase": "be renowned for", "cn": "因……而闻名", "usage": "正式表达，近义 be famous/well-known for。", "pattern": "主语 + be + renowned for + 名词 / 动名词", "example": "The region is renowned for its high-quality coffee.", "exampleCn": "该地区以高品质咖啡闻名。"}, {"id": 35, "paragraph": "D", "local": 4, "phrase": "the ability to do sth", "cn": "做某事的能力", "usage": "学术高频名词搭配。", "pattern": "主语 + have / require / develop + the ability to do sth", "example": "The ability to adapt is essential in a rapidly changing workplace.", "exampleCn": "适应能力在快速变化的职场中至关重要。"}, {"id": 36, "paragraph": "D", "local": 5, "phrase": "remain underwater for", "cn": "在水下持续……时间", "usage": "remain + 状态；可迁移到 remain stable/unchanged。", "pattern": "主语 + can / may remain underwater for + 时间", "example": "The animal can remain underwater for more than an hour.", "exampleCn": "这种动物可以在水下停留一个多小时。"}, {"id": 37, "paragraph": "D", "local": 6, "phrase": "in pursuit of", "cn": "为了追求/追逐……", "usage": "可用于目标，也可用于实际追逐。", "pattern": "主语 + 动词 + in pursuit of + 目标 / 机会", "example": "Many graduates move abroad in pursuit of better career opportunities.", "exampleCn": "许多毕业生为了追求更好的职业机会而移居海外。"}, {"id": 38, "paragraph": "D", "local": 7, "phrase": "have problems in doing sth", "cn": "在做某事方面有困难", "usage": "也常说 have difficulty/trouble doing sth。", "pattern": "主语 + have problems in doing sth", "example": "Some older adults have problems in using digital payment systems.", "exampleCn": "一些老年人在使用数字支付系统方面有困难。"}, {"id": 39, "paragraph": "D", "local": 8, "phrase": "respond by doing sth", "cn": "通过做某事来作出反应", "usage": "说明“反应方式”，逻辑清晰。", "pattern": "主语 + respond(s) by doing sth", "example": "The government responded by introducing stricter safety standards.", "exampleCn": "政府通过引入更严格的安全标准作出回应。"}, {"id": 40, "paragraph": "D", "local": 9, "phrase": "from time to time", "cn": "不时；偶尔", "usage": "频率表达，接近 occasionally。", "pattern": "完整句 + from time to time", "example": "The system needs to be updated from time to time.", "exampleCn": "这个系统需要不时进行更新。"}, {"id": 41, "paragraph": "D", "local": 10, "phrase": "large quantities of", "cn": "大量的……", "usage": "多用于不可数名词或物质；正式。", "pattern": "large quantities of + 不可数名词 + 复数谓语", "example": "Large quantities of water are required for industrial cooling.", "exampleCn": "工业冷却需要大量的水。"}, {"id": 42, "paragraph": "D", "local": 11, "phrase": "be exposed to", "cn": "暴露于；接触到……", "usage": "环境、风险、空气、媒体等语境高频。", "pattern": "主语 + be + exposed to + 风险 / 环境 / 信息", "example": "Children who are exposed to second-hand smoke face greater health risks.", "exampleCn": "接触二手烟的儿童面临更高的健康风险。"}, {"id": 43, "paragraph": "D", "local": 12, "phrase": "be embedded in", "cn": "嵌入；深植于……", "usage": "可用于实体，也可用于文化/制度等抽象语境。", "pattern": "主语 + be + embedded in + 物体 / 文化 / 制度", "example": "These values are deeply embedded in the local culture.", "exampleCn": "这些价值观深深植根于当地文化之中。"}, {"id": 44, "paragraph": "D", "local": 13, "phrase": "contrast A with B", "cn": "把 A 与 B 作对比", "usage": "雅思写作和阅读中非常实用。", "pattern": "主语 + contrast(s) + A + with + B", "example": "The study contrasts urban lifestyles with those in rural areas.", "exampleCn": "这项研究把城市生活方式与农村地区的生活方式进行对比。"}, {"id": 45, "paragraph": "E", "local": 1, "phrase": "be ruthlessly pursued by", "cn": "被……无情追捕/追求", "usage": "ruthlessly 强调毫不留情；常用于历史叙事。", "pattern": "主语 + be + ruthlessly pursued by + 人 / 群体", "example": "The animals were ruthlessly pursued by commercial hunters.", "exampleCn": "这些动物遭到商业猎人的无情追捕。"}, {"id": 46, "paragraph": "E", "local": 2, "phrase": "the imposition of a ban on", "cn": "对……实施禁令", "usage": "政策/法规类高频搭配。", "pattern": "the imposition of a ban on + 名词 + 动词 / 结果", "example": "The imposition of a ban on plastic bags reduced their use significantly.", "exampleCn": "对塑料袋实施禁令后，其使用量显著下降。"}, {"id": 47, "paragraph": "E", "local": 3, "phrase": "save ... from extinction", "cn": "使……免于灭绝", "usage": "save A from B 的典型环保用法。", "pattern": "主语 + save(s) + 物种 + from extinction", "example": "Conservation programmes helped save the species from extinction.", "exampleCn": "保护项目帮助该物种免于灭绝。"}, {"id": 48, "paragraph": "E", "local": 4, "phrase": "by far the most + adj.", "cn": "远远最……；最……得多", "usage": "用于加强最高级：by far the most important/valuable。", "pattern": "主语 + be + by far the most + 形容词最高级形式 + 名词 / 选项", "example": "Public transport is by far the most efficient option in the city centre.", "exampleCn": "公共交通是市中心效率高得多的选择。"}, {"id": 49, "paragraph": "E", "local": 5, "phrase": "be extracted from", "cn": "从……中提取", "usage": "自然资源、化学、食品、数据等语境通用。", "pattern": "主语 + be + extracted from + 原料 / 来源", "example": "The oil is extracted from seeds using a cold-pressing process.", "exampleCn": "这种油通过冷压工艺从种子中提取。"}, {"id": 50, "paragraph": "E", "local": 6, "phrase": "as a by-product of", "cn": "作为……的副产品", "usage": "可用于工业、经济、社会现象的结果。", "pattern": "主语 + be produced / occur + as a by-product of + 过程", "example": "Heat is produced as a by-product of the chemical reaction.", "exampleCn": "热量作为该化学反应的副产品产生。"}, {"id": 51, "paragraph": "E", "local": 7, "phrase": "prohibit trade in", "cn": "禁止……的贸易", "usage": "prohibit + 名词/doing；法律政策表达。", "pattern": "法律 / 机构 + prohibit(s) trade in + 商品 / 物种产品", "example": "The law prohibits trade in endangered animal products.", "exampleCn": "这项法律禁止濒危动物制品的贸易。"}, {"id": 52, "paragraph": "E", "local": 8, "phrase": "be supplanted by", "cn": "被……取代", "usage": "正式表达，近义 be replaced by。", "pattern": "旧事物 + be + supplanted by + 新事物", "example": "Printed maps have largely been supplanted by navigation apps.", "exampleCn": "纸质地图在很大程度上已被导航应用取代。"}, {"id": 53, "paragraph": "E", "local": 9, "phrase": "synthetic in origin", "cn": "来源为合成的；人工合成来源", "usage": "in origin = 在来源上。", "pattern": "主语 + be + synthetic in origin", "example": "Some modern fragrances are entirely synthetic in origin.", "exampleCn": "一些现代香料完全来源于人工合成。"}, {"id": 54, "paragraph": "E", "local": 10, "phrase": "recover to former numbers", "cn": "恢复到过去的数量水平", "usage": "可用于动物种群、人口、产量等。", "pattern": "种群 / 数量 + recover to former numbers", "example": "The population may take decades to recover to its former numbers.", "exampleCn": "这个种群可能需要几十年才能恢复到过去的数量水平。"}, {"id": 55, "paragraph": "E", "local": 11, "phrase": "in the wild", "cn": "在野外；在自然环境中", "usage": "与 in captivity 对比。", "pattern": "主语 + live / remain / survive + in the wild", "example": "Fewer than one thousand individuals remain in the wild.", "exampleCn": "野外仅剩不到一千只个体。"}, {"id": 56, "paragraph": "E", "local": 12, "phrase": "become a familiar sight to", "cn": "对……来说变成常见景象", "usage": "familiar sight = 常见景象。", "pattern": "主语 + become(s) a familiar sight to + 人群", "example": "Electric buses are becoming a familiar sight to commuters in major cities.", "exampleCn": "电动公交车正逐渐成为大城市通勤者熟悉的景象。"}];
const KEY='ambergris_collocation_v3'; let STATE={}; try{STATE=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){};
let currentId=1, para='ALL', query='', exampleVisible=true;
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
function rec(id){return DATA.find(x=>x.id===id)} function state(id){return STATE[id]||(STATE[id]={s1:'',s2:'',s3:'',done:false})}
function save(){localStorage.setItem(KEY,JSON.stringify(STATE)); stats();}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1400)}
function filtered(){return DATA.filter(x=>(para==='ALL'||x.paragraph===para)&&(!query||(`${x.phrase} ${x.cn}`).toLowerCase().includes(query.toLowerCase())))}
function chips(){const box=$('#chips');box.innerHTML='';['ALL','A','B','C','D','E'].forEach(p=>{const b=document.createElement('button');b.className='chip'+(p===para?' active':'');b.textContent=p==='ALL'?'全部':p;b.onclick=()=>{para=p;chips();renderList();ensureCurrent();render()};box.appendChild(b)})}
function renderList(){const box=$('#list');box.innerHTML='';const arr=filtered();if(!arr.length){box.innerHTML='<div class="empty">没有匹配结果</div>';return}arr.forEach(x=>{const s=state(x.id),b=document.createElement('button');b.className='item'+(x.id===currentId?' active':'');b.innerHTML=`<span class="num">${x.id}</span><span class="iname">${esc(x.phrase)}<i class="idot ${s.done?'done':''}"></i></span>`;b.onclick=()=>{currentId=x.id;render();renderList();window.scrollTo({top:0,behavior:'smooth'})};box.appendChild(b)})}
function ensureCurrent(){const a=filtered();if(a.length&&!a.some(x=>x.id===currentId))currentId=a[0].id}
function esc(s){return String(s).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]||m))}
function render(){const x=rec(currentId);if(!x)return;const s=state(x.id);$('#kicker').textContent=`Paragraph ${x.paragraph} · ${x.local} / ${DATA.filter(i=>i.paragraph===x.paragraph).length} · 全文 ${x.id} / ${DATA.length}`;$('#phrase').textContent=x.phrase;$('#meaning').textContent=x.cn;$('#usage').textContent=x.usage;$('#pattern').textContent=x.pattern;$('#exampleEn').textContent=x.example;$('#exampleCn').textContent=x.exampleCn;$('#exampleBox').classList.toggle('hidden',!exampleVisible);$('#toggleExample').textContent=exampleVisible?'隐藏例句':'显示例句';
const meta=[['s1','① 基础准确句','先套用上面的句型模板。只写一个清楚的主句，重点检查搭配、介词和主谓一致。'],['s2','② IELTS / 学术句','把搭配放进教育、环境、科技、社会等正式话题。可以加入原因、结果、对比或限定条件。'],['s3','③ 自由迁移句','换一个与参考例句完全不同的语境。可以写你的工作、生活、旅行、商业或任何熟悉场景。']];
const box=$('#steps');box.innerHTML='';meta.forEach(([k,name,hint])=>{const d=document.createElement('div');d.className='step';d.innerHTML=`<div class="stephead"><div><div class="stepname">${name}</div><div class="hint">${hint}</div></div><div class="count"><span>0</span> 字符</div></div><textarea placeholder="写下你的英文句子…"></textarea>`;const ta=d.querySelector('textarea'),ct=d.querySelector('.count span');ta.value=s[k]||'';ct.textContent=ta.value.length;ta.addEventListener('input',()=>{s[k]=ta.value;ct.textContent=ta.value.length;save()});box.appendChild(d)});$('#markDone').textContent=s.done?'↺ 取消完成':'✓ 标记完成';stats();}
function stats(){let done=0,sent=0;DATA.forEach(x=>{const s=state(x.id);if(s.done)done++;sent+=[s.s1,s.s2,s.s3].filter(v=>v&&v.trim()).length});$('#doneCount').textContent=done;$('#sentenceCount').textContent=sent;$('#fill').style.width=(done/DATA.length*100)+'%';}
function move(delta){const a=filtered();if(!a.length)return;let i=a.findIndex(x=>x.id===currentId);i=(i+delta+a.length)%a.length;currentId=a[i].id;render();renderList();window.scrollTo({top:0,behavior:'smooth'})}
function nextIncomplete(){const all=filtered(),idx=all.findIndex(x=>x.id===currentId);for(let n=1;n<=all.length;n++){const x=all[(idx+n)%all.length];if(!state(x.id).done){currentId=x.id;render();renderList();return}}toast('当前筛选下已经全部完成')}
function speak(text){if(!('speechSynthesis'in window))return toast('浏览器不支持朗读');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=.95;const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>/en-GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;speechSynthesis.speak(u)}
function prompt(){return `请批改我的 Ambergris 重点搭配造句。每个搭配最多有 3 句：基础准确句、IELTS/学术句、自由迁移句。\n\n逐句检查：\n1. 搭配是否完整、介词/结构是否正确；\n2. 语法是否正确；\n3. 是否自然、符合英语母语习惯；\n4. IELTS/学术句是否正式、逻辑清楚；\n5. 正确的句子不要过度改写。\n\n每句输出：\n原句：\n评价：✅ 正确 / ⚠️ 可优化 / ❌ 有错误\n问题：\n修改版：\n原因：用中文简洁解释\n\n最后总结：最常犯的3类错误、掌握最好的5个搭配、最需要复习的5个搭配，并根据错句出10道改错题（先不给答案）。`;}
function answerText(ids=DATA.map(x=>x.id)){let out=[];ids.forEach(id=>{const x=rec(id),s=state(id);if([s.s1,s.s2,s.s3].some(v=>v&&v.trim()))out.push(`[Paragraph ${x.paragraph} · ${x.phrase}]\n中文：${x.cn}\n句型模板：${x.pattern}\n1. ${s.s1||'(未填写)'}\n2. ${s.s2||'(未填写)'}\n3. ${s.s3||'(未填写)'}`)});return out.join('\n\n')}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('已复制')}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('已复制')}}
function exportRender(){ $('#promptBox').textContent=prompt();const box=$('#answers');box.innerHTML='';let n=0;DATA.forEach(x=>{const s=state(x.id);if([s.s1,s.s2,s.s3].some(v=>v&&v.trim())){n++;const d=document.createElement('div');d.className='answer';d.innerHTML=`<strong>${esc(x.paragraph+' · '+x.phrase)}</strong><div class="tiny">${esc(x.cn)}</div><ol><li>${esc(s.s1||'（未填写）')}</li><li>${esc(s.s2||'（未填写）')}</li><li>${esc(s.s3||'（未填写）')}</li></ol>`;box.appendChild(d)}});if(!n)box.innerHTML='<div class="empty">还没有填写任何句子。</div>'}
function tab(which){const study=which==='study';$('#tabStudy').classList.toggle('active',study);$('#tabAI').classList.toggle('active',!study);$('#studyView').classList.toggle('hidden',!study);$('#exportView').classList.toggle('active',!study);if(!study)exportRender()}
$('#search').addEventListener('input',e=>{query=e.target.value;ensureCurrent();renderList();render()});$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);$('#nextIncomplete').onclick=nextIncomplete;$('#random').onclick=()=>{const a=filtered();if(a.length){currentId=a[Math.floor(Math.random()*a.length)].id;render();renderList()}};$('#toggleExample').onclick=()=>{exampleVisible=!exampleVisible;render()};$('#speakExample').onclick=()=>speak(rec(currentId).example);$('#markDone').onclick=()=>{const s=state(currentId);if(!s.done&&[s.s1,s.s2,s.s3].filter(v=>v&&v.trim()).length<3&&!confirm('还有句子未填写，仍要标记完成吗？'))return;s.done=!s.done;save();render();renderList()};$('#clearCurrent').onclick=()=>{if(confirm('清空当前搭配的3个句子？')){STATE[currentId]={s1:'',s2:'',s3:'',done:false};save();render();renderList()}};$('#copyCurrent').onclick=()=>copy(prompt()+'\n\n====== 当前搭配 ======\n'+answerText([currentId]));$('#tabStudy').onclick=()=>tab('study');$('#tabAI').onclick=()=>tab('ai');$('#copyAll').onclick=()=>copy(prompt()+'\n\n====== 我的答案 ======\n'+answerText());$('#downloadTxt').onclick=()=>{const blob=new Blob([prompt()+'\n\n====== 我的答案 ======\n'+answerText()],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Ambergris_造句_AI批改稿.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};
chips();renderList();render();stats();
</script></body></html>
