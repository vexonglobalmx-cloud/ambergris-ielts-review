<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f4ef">
<title>Ambergris · IELTS 互动复习</title>
<style>
:root{
  --bg:#f6f3ee;--card:#fffdfb;--ink:#191919;--muted:#706a63;--line:#e5ded5;
  --dark:#1f1f1f;--red:#b42318;--redsoft:#fff0ed;--blue:#275b7a;--bluesoft:#edf5fa;
  --green:#2f6a4f;--greensoft:#edf8f2;--amber:#8a5b10;--ambersoft:#fff7e8;
  --shadow:0 12px 30px rgba(65,49,36,.07)
}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;line-height:1.65}
button,input,textarea,select{font:inherit}button{touch-action:manipulation}.wrap{max-width:1180px;margin:auto;padding:22px}.hero{background:linear-gradient(135deg,#fffdfb,#fff5f0);border:1px solid var(--line);border-radius:24px;padding:28px 30px;box-shadow:var(--shadow)}.hero h1{margin:0 0 6px;font-size:clamp(28px,4vw,44px);line-height:1.15}.hero p{margin:0;color:var(--muted)}
.topnav{position:sticky;top:0;z-index:30;background:rgba(246,243,238,.94);backdrop-filter:blur(10px);padding:12px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab,.pillbtn,.btn{border:1px solid var(--line);background:#fffdfb;color:var(--ink);padding:10px 15px;border-radius:999px;cursor:pointer;transition:.16s ease}.tab:hover,.pillbtn:hover,.btn:hover{transform:translateY(-1px);box-shadow:0 5px 12px rgba(50,40,30,.06)}.tab.active,.pillbtn.active{background:var(--dark);border-color:var(--dark);color:#fff}.view{display:none}.view.active{display:block}
/* Study */
.study-shell{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}.study-main,.study-side{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}.study-main{padding:24px}.study-side{padding:20px;position:sticky;top:92px}.study-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}.study-head h2{margin:0 0 5px;font-size:26px}.subtle{color:var(--muted);font-size:13px}
.mode-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0 20px}.mode-card{border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px;cursor:pointer;text-align:left;min-height:92px;transition:.16s ease}.mode-card strong{display:block;font-size:15px;margin-bottom:5px}.mode-card span{display:block;font-size:12px;color:var(--muted);line-height:1.45}.mode-card.active{background:var(--dark);color:#fff;border-color:var(--dark);box-shadow:0 8px 18px rgba(0,0,0,.12)}.mode-card.active span{color:#e4e4e4}.mode-num{display:inline-grid!important;place-items:center;width:25px;height:25px;border-radius:50%;background:#f1ece6;color:#3e3934!important;font-weight:800;margin-bottom:8px}.mode-card.active .mode-num{background:#fff;color:#222!important}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fbf9f6}.filters .labelmini{font-size:12px;font-weight:800;color:var(--muted);margin-right:2px}.seg{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;cursor:pointer;font-size:13px}.seg.active{background:#222;color:#fff;border-color:#222}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 0 8px}.qpos{font-size:13px;color:var(--muted)}.mode-badge{padding:4px 9px;border-radius:999px;background:#f0ece7;font-size:12px;font-weight:800}
.prompt-card{min-height:250px;border:1px solid #ece4dc;background:linear-gradient(180deg,#fcfaf7,#f7f3ef);border-radius:22px;padding:28px;display:grid;place-items:center;text-align:center}.prompt-inner{max-width:680px;width:100%}.kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:13px}.cn-prompt{font-size:clamp(25px,4vw,36px);font-weight:850;line-height:1.45}.listen-orb{width:92px;height:92px;border-radius:50%;border:1px solid #d9d0c7;background:#fff;cursor:pointer;font-size:42px;box-shadow:0 10px 24px rgba(65,49,36,.09);transition:.14s ease}.listen-orb:hover{transform:scale(1.035)}.listen-orb:active{transform:scale(.98)}.listen-status{height:24px;margin-top:10px;color:var(--blue);font-size:13px}.prompt-title{font-weight:850;font-size:18px;margin-top:12px}.prompt-help{color:var(--muted);font-size:13px;margin-top:6px}.source-hint{margin-top:14px;font-size:12px;color:#8b847c}
.answer-area{margin-top:16px}.answer-area label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}.answer-input{width:100%;min-height:54px;padding:13px 14px;border:1px solid #cfc7bf;border-radius:13px;background:#fff;outline:none}.answer-input:focus{border-color:#777;box-shadow:0 0 0 3px rgba(0,0,0,.05)}textarea.answer-input{resize:vertical;min-height:88px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.btn.primary{background:#222;border-color:#222;color:#fff}.btn.audio{background:var(--bluesoft);border-color:#d7e8f2;color:#234f69}.btn.danger{color:#8b2118}.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.feedback{display:none;margin-top:15px;border-radius:16px;padding:15px 16px}.feedback.show{display:block}.feedback.good{background:var(--greensoft);border:1px solid #cfe8da;color:#24553f}.feedback.bad{background:var(--redsoft);border:1px solid #f0d0ca;color:#7c2018}.feedback.neutral{background:var(--ambersoft);border:1px solid #eed9ae;color:#704a0f}.feedback .ans-word{font-size:22px;font-weight:900;color:var(--red)}.feedback .ans-cn{margin-top:4px}.feedback .example{font-size:12px;color:#6a625b;margin-top:8px}.self-grade{display:none;gap:8px;flex-wrap:wrap;margin-top:10px}.self-grade.show{display:flex}.self-grade button{border:1px solid currentColor;background:#fff;padding:7px 11px;border-radius:999px;cursor:pointer}
.side-title{margin:0 0 12px;font-size:19px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#f9f6f2;border-radius:13px;padding:11px 7px;text-align:center}.stat b{display:block;font-size:21px}.progress{height:8px;background:#eee8e2;border-radius:99px;overflow:hidden;margin:12px 0 16px}.progress i{display:block;height:100%;width:0;background:#222}.side-section{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}.checkline{display:flex;gap:8px;align-items:center;margin:9px 0;font-size:14px}.side-note{font-size:12px;color:var(--muted);line-height:1.55}.kbd{display:inline-block;border:1px solid #d8d0c8;border-bottom-width:2px;border-radius:5px;padding:0 5px;background:#fff;font-size:11px;color:#555}
/* Article */
.para-nav{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.para{margin:28px 0 48px}.para-title{display:flex;align-items:center;gap:10px}.badge{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;background:#222;color:#fff}.sentence{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 6px 16px rgba(60,45,35,.035)}.engrow{display:flex;align-items:flex-start;gap:10px}.eng{font-family:Georgia,"Times New Roman",serif;font-size:20px;line-height:1.65;flex:1}.speak{width:40px;height:40px;border:0;border-radius:50%;background:var(--bluesoft);color:var(--blue);cursor:pointer}.vocab-red{color:var(--red);font-weight:750;background:linear-gradient(transparent 76%,#ffd9d2 0)}.zh{margin:12px 0 2px;padding:11px 13px;border-left:3px solid #d8cfc7;background:#fbf9f7}.label{font-weight:850;font-size:14px;margin:15px 0 6px}.list{display:grid;gap:6px}.item{background:#fbf9f7;border-radius:10px;padding:7px 10px}.term{color:var(--red);font-weight:850}.coll-term{color:var(--blue);font-weight:850}.mini-speak{border:0;background:transparent;color:var(--blue);cursor:pointer}.difficult{margin-top:11px;padding:12px 14px;border:1px solid #f0dfad;background:#fff8e7;border-radius:12px}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;margin-top:10px;overflow:hidden}.panel summary{cursor:pointer;padding:14px 17px;font-weight:850}.inside{padding:0 17px 17px}.ielts-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.ibox{border:1px solid var(--line);border-radius:12px;padding:11px}.ibox h4{margin:0 0 6px}.ibox ul{margin:0;padding-left:18px}.expr-table{width:100%;border-collapse:collapse;font-size:14px}.expr-table th,.expr-table td{padding:9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.expr-table th{background:#faf7f3}.memory{display:flex;gap:7px;flex-wrap:wrap}.chip{background:var(--redsoft);color:#8d1d14;border-radius:999px;padding:5px 9px;font-weight:750;font-size:13px}
/* Bank */
.bank{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}.word-search{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:12px}.word-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.wordcard{border:1px solid var(--line);border-radius:13px;padding:12px}.wordcard .w{font-weight:900;color:var(--red)}.footer{text-align:center;color:var(--muted);font-size:12px;margin:35px 0}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:#222;color:#fff;padding:9px 14px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:90;font-size:13px}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:820px){.wrap{padding:14px}.hero{padding:22px}.study-shell{grid-template-columns:1fr}.study-side{position:static}.mode-grid{grid-template-columns:1fr}.mode-card{min-height:auto}.ielts-grid,.word-grid{grid-template-columns:1fr}.eng{font-size:18px}.study-main{padding:17px}.prompt-card{min-height:225px;padding:20px}.stats{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero"><h1>Ambergris · IELTS 互动复习</h1><p>逐句精读｜重点词汇标红｜英音朗读｜听义 / 中译英 / 听音拼写</p></header>
<nav class="topnav"><div class="tabs"><button class="tab active" data-view="article">文章精读</button><button class="tab" data-view="study">词汇听写 / 拼写</button><button class="tab" data-view="bank">重点词汇库</button></div><div class="para-nav" id="paraNav"></div></nav>

<section id="article" class="view active"></section>

<section id="study" class="view">
  <div class="study-shell">
    <main class="study-main">
      <div class="study-head"><div><h2>词汇听写 / 拼写</h2><div class="subtle">三个模式使用不同提示方式；英文拼写模式自动判分，中文释义模式由你核对后自评。</div></div><div class="mode-badge" id="modeBadge">听英写中</div></div>
      <div class="mode-grid" id="modeGrid">
        <button class="mode-card active" data-mode="listen-cn"><span class="mode-num">1</span><strong>🔊 听英文 → 写中文</strong><span>只听英文发音，写出核心中文意思；核对后自己标记“记住 / 需复习”。</span></button>
        <button class="mode-card" data-mode="cn-en"><span class="mode-num">2</span><strong>中 看中文 → 拼英文</strong><span>屏幕明确显示中文释义，你拼出对应英文单词。</span></button>
        <button class="mode-card" data-mode="listen-en"><span class="mode-num">3</span><strong>🔊 听发音 → 拼英文</strong><span>纯 spelling dictation：不显示中文或英文，只凭声音拼写。</span></button>
      </div>
      <div class="filters"><span class="labelmini">段落</span><button class="seg active" data-paragraph="ALL">全部</button><button class="seg" data-paragraph="A">A</button><button class="seg" data-paragraph="B">B</button><button class="seg" data-paragraph="C">C</button><button class="seg" data-paragraph="D">D</button><button class="seg" data-paragraph="E">E</button></div>
      <div class="quiz-meta"><div class="qpos" id="qMeta">准备题目…</div><div class="subtle" id="deckMeta"></div></div>
      <div class="prompt-card" id="promptCard"></div>
      <div class="answer-area"><label id="answerLabel" for="answerInput">你的答案</label><textarea id="answerInput" class="answer-input" autocomplete="off" spellcheck="false" placeholder="输入答案"></textarea></div>
      <div class="actions"><button class="btn primary" id="checkBtn">核对答案</button><button class="btn audio" id="replayBtn">🔊 再听一次</button><button class="btn" id="revealBtn">显示答案</button><button class="btn" id="nextBtn">下一题 →</button></div>
      <div class="feedback" id="feedback"></div>
      <div class="self-grade" id="selfGrade"><button id="selfGood">✓ 基本正确 / 记住了</button><button id="selfBad">↺ 不熟 / 需复习</button></div>
    </main>
    <aside class="study-side">
      <h3 class="side-title">复习进度</h3>
      <div class="stats"><div class="stat"><b id="attemptsStat">0</b><span class="subtle">已作答</span></div><div class="stat"><b id="correctStat">0</b><span class="subtle">答对</span></div><div class="stat"><b id="wrongStat">0</b><span class="subtle">需复习</span></div></div>
      <div class="progress"><i id="progressBar"></i></div>
      <div class="side-section"><label class="checkline"><input type="checkbox" id="wrongFirst"> 错词 / 不熟词优先</label><label class="checkline"><input type="checkbox" id="autoSpeak" checked> 新题自动朗读（模式 1、3）</label><label class="checkline"><input type="checkbox" id="shuffleMode" checked> 随机出题</label></div>
      <div class="side-section"><div class="side-note"><b>键盘：</b><span class="kbd">Enter</span> 核对；核对后再按 <span class="kbd">Enter</span> 下一题。模式 1 核对后请点“记住了”或“需复习”。</div><button class="btn danger" id="resetBtn" style="margin-top:12px">重置复习记录</button></div>
      <div class="side-section"><div class="side-note"><b>英音：</b>优先调用设备中的 <code>en-GB</code> 系统语音。没有英音时会退回其他英文语音。</div></div>
    </aside>
  </div>
</section>

<section id="bank" class="view"><div class="bank"><h2 style="margin-top:0">重点词汇库</h2><input class="word-search" id="wordSearch" placeholder="搜索英文或中文…"><div class="word-grid" id="wordGrid"></div></div></section>
<div class="footer">复习记录仅保存在当前浏览器的 localStorage 中。</div>
</div>
<div class="toast" id="toast"></div>
<script>
const ARTICLE=[{"letter":"A","sentences":[{"num":1,"english":"In the ancient world, the waxy grey substance we now refer to as ambergris was highly prized for its medicinal properties, and was widely used as a spice, which was believed to be an aphrodisiac when added to food or wine.","chinese":"在古代，我们如今称为龙涎香（ambergris）的这种蜡状灰色物质，因其药用价值而备受珍视，也被广泛用作香料；人们认为，把它加入食物或葡萄酒中时，它具有催情作用。","vocab":[{"term":"waxy","definition":"蜡状的；像蜡的。","highlight":"waxy"},{"term":"substance","definition":"物质；学术阅读中常用来泛指某种材料或物质。","highlight":"substance"},{"term":"prize (v.)","definition":"珍视，重视；本句不是“奖品”的意思。","highlight":"prize"},{"term":"medicinal","definition":"药用的；治疗用的。","highlight":"medicinal"},{"term":"property","definition":"性质、特性；本句 medicinal properties 指“药用性质/功效”，不是“财产”。","highlight":"property"},{"term":"spice","definition":"香料；调味料。","highlight":"spice"},{"term":"aphrodisiac","definition":"催情剂；被认为能增强性欲的物质。","highlight":"aphrodisiac"}],"collocations":[{"term":"refer to A as B","definition":"把 A 称为 B。"},{"term":"be highly prized for","definition":"因……而备受珍视。"},{"term":"medicinal properties","definition":"药用性质；药用功效。"},{"term":"be widely used as","definition":"被广泛用作……。"},{"term":"be believed to be","definition":"被认为是……；注意“认为”不等于“证实”。"},{"term":"be added to","definition":"被加入……中。"}],"difficult":["we now refer to as ambergris 修饰前面的 substance，可直接理解为“我们现在称作龙涎香的这种物质”。","when added to food or wine = when it was added to food or wine。“被加入食物或酒中时”。"]},{"num":2,"english":"Ambergris itself is pleasantly aromatic, especially when warmed, and it was also highly valued as a fixing agent in the making of perfume, since it enabled a scent to retain its fragrance for much longer than might otherwise have been possible.","chinese":"龙涎香本身具有令人愉悦的香气，尤其是在加热之后。它在香水制作中也因可作为定香剂而备受重视，因为它能让香味维持的时间远远长于没有它时原本可能达到的程度。","vocab":[{"term":"aromatic","definition":"芳香的；有香味的。","highlight":"aromatic"},{"term":"fixing agent","definition":"定香剂；能帮助香味持久的物质。","highlight":"fixing agent"},{"term":"scent","definition":"气味；香味。","highlight":"scent"},{"term":"retain","definition":"保持；保留。雅思学术阅读高频词。","highlight":"retain"},{"term":"fragrance","definition":"芳香；香气。","highlight":"fragrance"},{"term":"otherwise","definition":"否则；在其他情况下。这里隐含“如果没有龙涎香”。","highlight":"otherwise"}],"collocations":[{"term":"be highly valued as","definition":"作为……而受到高度重视。"},{"term":"in the making of perfume","definition":"在香水制作过程中。"},{"term":"enable A to do B","definition":"使 A 能够做 B。"},{"term":"retain its fragrance","definition":"保持其香味。"},{"term":"much longer than","definition":"比……长得多。"}],"difficult":["since 在本句表示“因为”，相当于 because，不是“自从”。","than might otherwise have been possible 中 otherwise 隐含“如果没有龙涎香这种定香作用”。整句重点是：龙涎香能显著延长香味持续时间。"]},{"num":3,"english":"Most ambergris was found in the form of lumps floating on the surface of the sea, or washed up on the shores of tropical and temperate oceans.","chinese":"人们发现的龙涎香大多呈块状，漂浮在海面上，或者被海浪冲到热带和温带海域的岸边。","vocab":[{"term":"lump","definition":"块；团。","highlight":"lump"},{"term":"float","definition":"漂浮。","highlight":"float"},{"term":"surface","definition":"表面；the surface of the sea 指“海面”。","highlight":"surface"},{"term":"shore","definition":"海岸；岸边。","highlight":"shore"},{"term":"tropical","definition":"热带的。","highlight":"tropical"},{"term":"temperate","definition":"温带的。","highlight":"temperate"}],"collocations":[{"term":"in the form of...","definition":"以……的形式。"},{"term":"float on the surface of...","definition":"漂浮在……表面。"},{"term":"wash up","definition":"被海浪冲上岸。"},{"term":"be washed up on the shore","definition":"被冲到岸边。"},{"term":"tropical and temperate oceans","definition":"热带和温带海域。"}],"difficult":[]},{"num":4,"english":"At one time, ambergris was worth its weight in gold, but there was much confusion about its origins.","chinese":"龙涎香曾经极其珍贵，几乎与同等重量的黄金一样值钱，但人们对于它究竟来自哪里却长期存在很大的疑惑。","vocab":[{"term":"worth","definition":"值……钱；具有……价值。","highlight":"worth"},{"term":"weight","definition":"重量。","highlight":"weight"},{"term":"confusion","definition":"困惑；混淆；不确定。","highlight":"confusion"},{"term":"origin","definition":"起源；来源。","highlight":"origin"}],"collocations":[{"term":"at one time","definition":"曾经；一度。"},{"term":"be worth its weight in gold","definition":"价值极高；极其珍贵。"},{"term":"confusion about","definition":"对……的困惑/不确定。"},{"term":"the origins of...","definition":"……的起源/来源。"}],"difficult":[]}],"logic":"历史价值与用途 → 香气及定香作用 → 常见发现方式 → 价值极高但来源成谜。最后一句制造悬念，为后文追溯 ambergris 的真正来源做铺垫。","ielts":{"熟词僻义":["property：本段不是“财产”，而是“性质、特性”。","prize：作动词时表示“珍视、重视”。","agent：fixing agent 中表示“起某种作用的物质/制剂”。"],"容易出现在判断题里的表达":["was believed to be an aphrodisiac 只表示“人们相信”，不代表科学上已经证实。","Most ambergris was found... 表示“大多数”，不是“所有”。","there was much confusion about its origins 表示来源当时仍不清楚。"],"重要逻辑词":["since = because，给出龙涎香被用于香水制作的原因。","but 表转折：价值极高，却来源不明。","otherwise 引出隐含条件：如果没有这种定香剂，香味不会维持那么久。"],"高频同义替换":["be highly prized ≈ be highly valued ≈ be considered valuable","origin ≈ source ≈ where it came from","retain its fragrance ≈ keep/maintain its scent ≈ allow the smell to last","wash up on the shore ≈ wash ashore"]},"expressions":[{"expression":"refer to A as B","meaning":"把 A 称为 B","replacement":"call A B / describe A as B"},{"expression":"be highly prized for","meaning":"因……而备受珍视","replacement":"be highly valued for"},{"expression":"medicinal properties","meaning":"药用性质/功效","replacement":"healing properties"},{"expression":"enable A to do B","meaning":"使 A 能够做 B","replacement":"allow A to do / make it possible for A to do"},{"expression":"in the form of","meaning":"以……的形式","replacement":"take the form of"},{"expression":"be worth its weight in gold","meaning":"价值极高","replacement":"be extremely valuable"}],"memory":["refer to A as B","be highly prized for","medicinal properties","enable A to do B","retain its fragrance","in the form of","wash up / wash ashore","be worth its weight in gold"]},{"letter":"B","sentences":[{"num":1,"english":"Ambergris was known to the Arabs as 'ambar' and was originally called amber in the West in the Middle Ages.","chinese":"阿拉伯人把龙涎香称为“ambar”，而在中世纪的西方，它最初也被称为 amber。","vocab":[{"term":"originally","definition":"最初；原来。","highlight":"originally"},{"term":"the Middle Ages","definition":"中世纪。","highlight":"the Middle Ages"}],"collocations":[{"term":"be known to A as B","definition":"被 A 称为 B；在 A 看来叫作 B。"},{"term":"be called","definition":"被称为……。"}],"difficult":[]},{"num":2,"english":"This eventually led to further confusion in the popular mind between ambergris and true amber, the mineral known to mineralogists as succinite, which is actually fossilised tree resin, and generally yellow in colour.","chinese":"这最终使普通大众进一步把龙涎香和真正的琥珀混淆起来。真正的琥珀是一种被矿物学家称为 succinite 的物质，实际上是树脂的化石，通常呈黄色。","vocab":[{"term":"eventually","definition":"最终；最后。","highlight":"eventually"},{"term":"popular","definition":"大众的；普通人的。这里 popular mind 指“大众认知”。","highlight":"popular"},{"term":"mineralogist","definition":"矿物学家。","highlight":"mineralogist"},{"term":"succinite","definition":"琥珀矿物学名称之一。","highlight":"succinite"},{"term":"fossilised","definition":"化石化的。","highlight":"fossilised"},{"term":"resin","definition":"树脂。","highlight":"resin"}],"collocations":[{"term":"lead to","definition":"导致。"},{"term":"confusion between A and B","definition":"A 与 B 之间的混淆。"},{"term":"be known to... as...","definition":"被……称为……。"},{"term":"be yellow in colour","definition":"呈黄色。"}],"difficult":["the mineral known to mineralogists as succinite 是对 true amber 的补充说明；which is actually fossilised tree resin 继续说明真正琥珀的本质。阅读时抓住“true amber = fossilised tree resin”即可。"]},{"num":3,"english":"Both substances were rare and costly, and both were associated with the sea, largely because for Europeans the most common source of amber was the shores of the Baltic.","chinese":"这两种物质都很稀有且昂贵，而且都与海洋联系在一起，这主要是因为对欧洲人而言，琥珀最常见的来源就是波罗的海沿岸。","vocab":[{"term":"substance","definition":"物质。","highlight":"substance"},{"term":"rare","definition":"稀有的。","highlight":"rare"},{"term":"costly","definition":"昂贵的；代价高的。","highlight":"costly"},{"term":"source","definition":"来源。","highlight":"source"},{"term":"the Baltic","definition":"波罗的海地区/波罗的海。","highlight":"the Baltic"}],"collocations":[{"term":"be associated with","definition":"与……有关联。"},{"term":"largely because","definition":"主要因为。"},{"term":"the most common source of","definition":"……最常见的来源。"},{"term":"the shores of","definition":"……的海岸。"}],"difficult":[]},{"num":4,"english":"In Chapter 92 of Moby Dick, the American writer Herman Melville pours scorn on those who believed the two substances to be the same:","chinese":"在《白鲸》第 92 章中，美国作家赫尔曼·梅尔维尔嘲讽了那些认为这两种物质是同一种东西的人。","vocab":[{"term":"scorn","definition":"轻蔑；嘲讽。","highlight":"scorn"},{"term":"substance","definition":"物质。","highlight":"substance"}],"collocations":[{"term":"pour scorn on","definition":"嘲笑；蔑视；对……表示强烈不屑。"},{"term":"believe A to be B","definition":"认为 A 是 B。"},{"term":"the two substances","definition":"这两种物质。"}],"difficult":[]},{"num":5,"english":"Though the word ambergris is but the French compound for grey amber, yet the two substances are quite distinct.","chinese":"虽然 ambergris 这个词不过是法语中“灰色琥珀”的复合词，但这两种物质实际上完全不同。","vocab":[{"term":"compound","definition":"复合词；复合物。","highlight":"compound"},{"term":"distinct","definition":"不同的；有明显区别的。","highlight":"distinct"}],"collocations":[{"term":"be quite distinct","definition":"完全不同；有明显区别。"},{"term":"the compound for","definition":"表示……的复合词。"}],"difficult":["Though ... yet ... 都在表达让步转折。现代英语通常不用同时出现，但这里是文学性较强的旧式表达。核心只需抓“名字相似，但两者完全不同”。"]},{"num":6,"english":"For amber, though at times found on the sea-coast, is also dug up in some far-inland soils, whereas ambergris is never found except upon the sea.","chinese":"因为琥珀虽然有时会在海岸被发现，但也能从远离海岸的内陆土壤中挖出；而龙涎香则只会在海上或海边被发现。","vocab":[{"term":"at times","definition":"有时。","highlight":"at times"},{"term":"sea-coast","definition":"海岸。","highlight":"sea-coast"},{"term":"far-inland","definition":"远离海岸的内陆地区。","highlight":"far-inland"},{"term":"soil","definition":"土壤。","highlight":"soil"},{"term":"whereas","definition":"然而；而，用于对比。","highlight":"whereas"}],"collocations":[{"term":"be dug up","definition":"被挖出。"},{"term":"inland soils","definition":"内陆土壤。"},{"term":"be found except...","definition":"除……之外不会被发现。"},{"term":"A, whereas B","definition":"A……，而 B……。"}],"difficult":["never found except upon the sea = 只在海上/海边才能发现。英语里的“never...except...”常可直接转成中文“只……”。"]},{"num":7,"english":"Besides, amber is a hard, transparent, brittle, odourless substance, used for mouth-pieces to pipes, for beads and ornaments; but ambergris is soft, waxy, and so highly fragrant that it is largely used in perfumery.","chinese":"此外，琥珀质地坚硬、透明、易碎而且无味，可用来制作烟斗嘴、珠子和装饰品；而龙涎香则柔软、呈蜡状、香气极浓，因此被大量用于香水制造。","vocab":[{"term":"transparent","definition":"透明的。","highlight":"transparent"},{"term":"brittle","definition":"易碎的；脆的。","highlight":"brittle"},{"term":"odourless","definition":"无气味的。","highlight":"odourless"},{"term":"bead","definition":"珠子。","highlight":"bead"},{"term":"ornament","definition":"装饰品。","highlight":"ornament"},{"term":"fragrant","definition":"芳香的。","highlight":"fragrant"},{"term":"perfumery","definition":"香水制造业；香料业。","highlight":"perfumery"}],"collocations":[{"term":"be used for","definition":"被用于……。"},{"term":"be largely used in","definition":"大量用于……。"},{"term":"so...that...","definition":"如此……以至于……。"},{"term":"hard, transparent, brittle, odourless","definition":"用于描述材料特性的并列形容词。"}],"difficult":[]}],"logic":"名称演变造成混淆 → 真正的 amber（琥珀）与 ambergris（龙涎香）都稀有且与海有关 → Melville 明确指出两者完全不同，并从来源、质地、气味和用途上作对比。","ielts":{"熟词僻义":["popular：这里不是“受欢迎的”，而是“大众的、普通人的”。","compound：这里指“复合词”，不是单纯的“化合物”。","distinct：在学术阅读中常表示“明显不同的、独立的”。"],"容易出现在判断题里的表达":["Both substances were rare and costly：两者都稀有且昂贵。","amber is also dug up in some far-inland soils：琥珀不仅出现在海边，也能在内陆挖出。","ambergris is never found except upon the sea：龙涎香的发现与海洋密切相关。","amber is odourless，而 ambergris highly fragrant：气味特征完全相反。"],"重要逻辑词":["eventually 表结果发展的最终状态。","largely because 引出主要原因。","whereas / but 用于强烈对比 amber 与 ambergris。","Besides 补充另一组区别。"],"高频同义替换":["lead to confusion ≈ cause confusion","be associated with ≈ be linked to / be connected with","distinct ≈ different / separate","costly ≈ expensive","be dug up ≈ be excavated / be unearthed"]},"expressions":[{"expression":"lead to confusion","meaning":"导致混淆","replacement":"cause confusion"},{"expression":"be associated with","meaning":"与……有关","replacement":"be linked/connected with"},{"expression":"pour scorn on","meaning":"嘲笑；蔑视","replacement":"mock / ridicule"},{"expression":"be quite distinct","meaning":"明显不同","replacement":"be very different"},{"expression":"be dug up","meaning":"被挖出","replacement":"be unearthed"},{"expression":"be largely used in","meaning":"被大量用于","replacement":"be widely used in"}],"memory":["lead to confusion","be associated with","pour scorn on","be quite distinct","whereas","be dug up","so...that...","be largely used in"]},{"letter":"C","sentences":[{"num":1,"english":"Moby Dick was published in 1851, by which time the mystery of the origins of ambergris had been resolved by the scientific community.","chinese":"《白鲸》出版于 1851 年，而到那时，龙涎香来源之谜已经被科学界解决。","vocab":[{"term":"mystery","definition":"谜；谜团。","highlight":"mystery"},{"term":"origin","definition":"起源；来源。","highlight":"origin"},{"term":"resolve","definition":"解决；解开。","highlight":"resolve"},{"term":"scientific community","definition":"科学界。","highlight":"scientific community"}],"collocations":[{"term":"by which time","definition":"到那时为止。"},{"term":"the mystery of...","definition":"……之谜。"},{"term":"be resolved by","definition":"被……解决。"},{"term":"the scientific community","definition":"科学界。"}],"difficult":["by which time = by 1851。它强调“截至 1851 年，这件事已经发生”。做时间顺序题时很重要。"]},{"num":2,"english":"In 1783, the botanist Joseph Banks, who had accompanied Captain James Cook on his voyages of discovery in the Pacific, presented a paper to the Royal Society of London by the German physician Dr Franz Xavier Schwediawer in which it was conclusively proved that ambergris came from sperm whales.","chinese":"1783 年，植物学家约瑟夫·班克斯向伦敦皇家学会提交了一篇由德国医生弗朗茨·泽维尔·施韦迪奥尔撰写的论文。班克斯曾陪同詹姆斯·库克船长进行太平洋探索航行；这篇论文确凿地证明了龙涎香来自抹香鲸。","vocab":[{"term":"botanist","definition":"植物学家。","highlight":"botanist"},{"term":"accompany","definition":"陪同；伴随。","highlight":"accompany"},{"term":"voyage","definition":"航行；远航。","highlight":"voyage"},{"term":"physician","definition":"医生；内科医师。","highlight":"physician"},{"term":"conclusively","definition":"确凿地；决定性地。","highlight":"conclusively"},{"term":"sperm whale","definition":"抹香鲸。","highlight":"sperm whale"}],"collocations":[{"term":"accompany sb on","definition":"陪同某人进行……。"},{"term":"voyage of discovery","definition":"探索航行。"},{"term":"present a paper to","definition":"向……提交/宣读论文。"},{"term":"conclusively prove that","definition":"确凿地证明……。"},{"term":"come from","definition":"来自……。"}],"difficult":["这句信息多，但主线很简单：1783 年 → Banks 向 Royal Society 提交 Schwediawer 的论文 → 论文 conclusively proved 龙涎香来自 sperm whales。中间关于 Cook 的内容只是 Banks 的背景信息。"]},{"num":3,"english":"In this, he was confirming an observation made in the 13th century by the great Venetian traveller Marco Polo who, while on the island of Socotra in the Indian Ocean, had witnessed a sperm whale vomiting up ambergris.","chinese":"这一结论印证了 13 世纪威尼斯旅行家马可·波罗的一次观察：他在印度洋的索科特拉岛时，曾亲眼看到一头抹香鲸吐出龙涎香。","vocab":[{"term":"confirm","definition":"证实；印证。","highlight":"confirm"},{"term":"observation","definition":"观察；观察结果。","highlight":"observation"},{"term":"Venetian","definition":"威尼斯的；威尼斯人的。","highlight":"Venetian"},{"term":"witness","definition":"亲眼目睹。","highlight":"witness"},{"term":"vomit","definition":"呕吐。","highlight":"vomit"}],"collocations":[{"term":"confirm an observation","definition":"证实/印证一项观察。"},{"term":"make an observation","definition":"进行观察。"},{"term":"witness sb/sth doing","definition":"目睹某人/某物正在做……。"},{"term":"vomit up","definition":"吐出。"}],"difficult":["who...had witnessed... 修饰 Marco Polo。while on the island of Socotra 只是插入的地点背景；核心事实是 Marco Polo witnessed a sperm whale vomiting up ambergris。"]},{"num":4,"english":"But whereas Marco Polo imagined that the whale had swallowed the lump in the depths of the sea, Schwediawer showed that the origin of the material was inside the whale itself.","chinese":"但是，马可·波罗以为鲸是在深海中吞下了那块物质；施韦迪奥尔则证明，这种物质实际上是在鲸的体内形成的。","vocab":[{"term":"imagine","definition":"认为；设想。","highlight":"imagine"},{"term":"swallow","definition":"吞下。","highlight":"swallow"},{"term":"depth","definition":"深处；深度。","highlight":"depth"},{"term":"material","definition":"物质；材料。","highlight":"material"},{"term":"origin","definition":"来源；起源。","highlight":"origin"}],"collocations":[{"term":"in the depths of the sea","definition":"在深海中。"},{"term":"the origin of the material","definition":"这种物质的来源。"},{"term":"inside the whale itself","definition":"就在鲸体内。"},{"term":"whereas A..., B...","definition":"A……，而 B……，用于对比两个观点。"}],"difficult":["本句的核心不是“有没有看见鲸吐出龙涎香”，而是两人对来源机制的理解不同：Marco Polo 认为鲸先从海里吞进去；Schwediawer 认为物质本身起源于鲸体内。"]}],"logic":"1851 年时科学界已解决来源之谜 → 1783 年 Schwediawer 的研究证明龙涎香来自抹香鲸 → 这一结论与 13 世纪 Marco Polo 的观察相呼应 → 但 Schwediawer 进一步纠正了 Marco Polo 对“龙涎香来自哪里”的理解。","ielts":{"熟词僻义":["paper：这里指“学术论文”，不是普通“纸张”。","community：scientific community = 科学界/科学共同体。","observation：可表示“观察结果”，而非仅“观察这个动作”。"],"容易出现在判断题里的表达":["by 1851 the mystery... had been resolved：1851 年以前科学界已解决该谜题。","conclusively proved：语气很强，表示“确凿证明”，不是“提出猜测”。","Marco Polo witnessed a whale vomiting up ambergris，但他误解了 ambergris 的真正形成位置。"],"重要逻辑词":["by which time 建立时间先后关系。","In this 表示“在这一点/这一结论上”。","But whereas 用于比较两种解释并突出差异。"],"高频同义替换":["resolve a mystery ≈ solve a mystery","conclusively prove ≈ establish / demonstrate with certainty","confirm an observation ≈ support/verify an observation","origin ≈ source"]},"expressions":[{"expression":"by which time","meaning":"到那时为止","replacement":"by then"},{"expression":"resolve a mystery","meaning":"解开谜团","replacement":"solve a mystery"},{"expression":"present a paper to","meaning":"向……提交/宣读论文","replacement":"submit/present research to"},{"expression":"conclusively prove that","meaning":"确凿证明……","replacement":"demonstrate/establish that"},{"expression":"confirm an observation","meaning":"印证观察","replacement":"verify/support an observation"},{"expression":"witness A doing B","meaning":"目睹 A 做 B","replacement":"see A doing B"}],"memory":["by which time","resolve the mystery of","voyage of discovery","present a paper to","conclusively prove that","confirm an observation","witness A doing B","whereas"]},{"letter":"D","sentences":[{"num":1,"english":"The sperm whale is the largest of the odontocetes, or toothed whales.","chinese":"抹香鲸是齿鲸类中体型最大的物种。","vocab":[{"term":"odontocete","definition":"齿鲸类动物。","highlight":"odontocete"},{"term":"toothed whale","definition":"齿鲸。","highlight":"toothed whale"}],"collocations":[{"term":"the largest of","definition":"……中最大的。"},{"term":"or","definition":"这里用于同位解释：odontocetes，也就是 toothed whales。"}],"difficult":[]},{"num":2,"english":"Males can grow up to 20 metres in length.","chinese":"雄性抹香鲸体长可达 20 米。","vocab":[{"term":"male","definition":"雄性个体。","highlight":"male"},{"term":"length","definition":"长度。","highlight":"length"}],"collocations":[{"term":"grow up to","definition":"长到……之多。"},{"term":"in length","definition":"在长度上；长达……。"}],"difficult":[]},{"num":3,"english":"Melville described the sperm whale as 'the king of whales', and his novel Moby Dick is based on the pursuit of one such creature.","chinese":"梅尔维尔把抹香鲸称为“鲸中之王”，而他的小说《白鲸》正是以追捕这样一头鲸为故事基础。","vocab":[{"term":"pursuit","definition":"追逐；追捕。","highlight":"pursuit"},{"term":"creature","definition":"生物；动物。","highlight":"creature"}],"collocations":[{"term":"describe A as B","definition":"把 A 描述为 B。"},{"term":"be based on","definition":"以……为基础。"},{"term":"the pursuit of","definition":"对……的追捕/追逐。"},{"term":"one such creature","definition":"这样的一只/一个生物。"}],"difficult":[]},{"num":4,"english":"Sperm whales are renowned for their ability to dive to great depths, possibly as far as 3 000 metres below the surface, and for remaining underwater for periods of two hours or more in pursuit of their favourite prey, the giant squid.","chinese":"抹香鲸以强大的深潜能力著称，可能潜到水面以下约 3000 米；它们还可以在水下停留两小时甚至更久，以追捕最喜欢的猎物——巨型乌贼。","vocab":[{"term":"renowned","definition":"著名的；以……闻名的。","highlight":"renowned"},{"term":"depth","definition":"深度；深处。","highlight":"depth"},{"term":"prey","definition":"猎物。","highlight":"prey"},{"term":"giant squid","definition":"巨型乌贼。","highlight":"giant squid"}],"collocations":[{"term":"be renowned for","definition":"以……而闻名。"},{"term":"dive to great depths","definition":"潜到很深的水域。"},{"term":"remain underwater","definition":"停留在水下。"},{"term":"for periods of","definition":"持续……时间。"},{"term":"in pursuit of","definition":"为了追捕；追逐……。"}],"difficult":["两个 for 并列：are renowned for their ability... and for remaining...，即“因深潜能力”和“因能长时间待在水下”而闻名。in pursuit of 说明长时间潜水的目的：追捕巨型乌贼。"]},{"num":5,"english":"It is from the problems the whales have in digesting the beaks of such creatures that ambergris has its origins.","chinese":"龙涎香的形成，正是源于抹香鲸在消化这些动物的喙时遇到的问题。","vocab":[{"term":"digest","definition":"消化。","highlight":"digest"},{"term":"beak","definition":"喙；这里指乌贼坚硬的“嘴”。","highlight":"beak"},{"term":"origin","definition":"起源；来源。","highlight":"origin"}],"collocations":[{"term":"have problems in doing","definition":"做……有困难。"},{"term":"digest the beaks","definition":"消化这些喙。"},{"term":"have its origins in/from","definition":"起源于……。"}],"difficult":["这是强调句，表面较绕。直接还原成：Ambergris has its origins in/from the problems the whales have in digesting the beaks... 核心就是“龙涎香源自抹香鲸消化乌贼喙时出现的问题”。"]},{"num":6,"english":"The beak is sharp and irritates the whale's lower intestine, which responds by producing a black, foul-smelling liquid.","chinese":"乌贼的喙很尖锐，会刺激抹香鲸的下段肠道；肠道随后会通过产生一种黑色、恶臭的液体来作出反应。","vocab":[{"term":"sharp","definition":"尖锐的。","highlight":"sharp"},{"term":"irritate","definition":"刺激；使发炎/不适。","highlight":"irritate"},{"term":"intestine","definition":"肠；肠道。","highlight":"intestine"},{"term":"foul-smelling","definition":"恶臭的。","highlight":"foul-smelling"}],"collocations":[{"term":"irritate the intestine","definition":"刺激肠道。"},{"term":"respond by doing","definition":"通过做……作出反应。"},{"term":"produce a liquid","definition":"产生液体。"},{"term":"foul-smelling liquid","definition":"恶臭液体。"}],"difficult":[]},{"num":7,"english":"It is not clear to scientists whether this secretion should be considered a normal response by the whale's digestive system or a pathological one, but from time to time large quantities of the liquid are vomited up by the whale.","chinese":"科学家尚不清楚这种分泌究竟应被视为抹香鲸消化系统的正常反应，还是一种病理反应；不过，抹香鲸会不时吐出大量这种液体。","vocab":[{"term":"secretion","definition":"分泌物；分泌。","highlight":"secretion"},{"term":"digestive system","definition":"消化系统。","highlight":"digestive system"},{"term":"pathological","definition":"病理性的；由疾病引起的。","highlight":"pathological"},{"term":"quantity","definition":"数量。","highlight":"quantity"}],"collocations":[{"term":"it is not clear whether...","definition":"尚不清楚是否/究竟……。"},{"term":"be considered a normal response","definition":"被视为正常反应。"},{"term":"from time to time","definition":"不时；偶尔。"},{"term":"large quantities of","definition":"大量的……。"},{"term":"be vomited up","definition":"被吐出。"}],"difficult":["whether A or B 是“究竟是 A 还是 B”。判断题中应注意：原文明确说 scientists are not clear，因此任何断言“这是正常反应”或“这是病理反应”的题目都不能直接由原文支持。"]},{"num":8,"english":"Once outside the whale's body and exposed to air, the substance hardens, acquiring the waxy, greyish and pleasantly aromatic characteristics of ambergris.","chinese":"这种物质一旦离开鲸体并暴露在空气中，就会逐渐变硬，同时获得龙涎香所具有的蜡状、灰白色以及怡人芳香等特征。","vocab":[{"term":"expose","definition":"使暴露；接触。","highlight":"expose"},{"term":"harden","definition":"变硬；硬化。","highlight":"harden"},{"term":"acquire","definition":"获得；逐渐具有。","highlight":"acquire"},{"term":"greyish","definition":"略带灰色的。","highlight":"greyish"},{"term":"characteristic","definition":"特征；特性。","highlight":"characteristic"}],"collocations":[{"term":"be exposed to air","definition":"暴露在空气中。"},{"term":"harden","definition":"发生硬化。"},{"term":"acquire the characteristics of","definition":"获得……的特征。"},{"term":"once outside...","definition":"一旦离开……。"}],"difficult":["Once outside the whale’s body and exposed to air 可理解为 Once the substance is outside... and is exposed to air。重点是形成顺序：离开鲸体 + 接触空气 → 硬化 → 获得龙涎香特征。"]},{"num":9,"english":"Often the beaks of squid are still found embedded in lumps of ambergris, some of which can weigh several hundred kilograms.","chinese":"人们常常仍能在龙涎香块中发现嵌在里面的乌贼喙，其中一些龙涎香块甚至可重达数百公斤。","vocab":[{"term":"embedded","definition":"嵌入的；埋在其中的。","highlight":"embedded"},{"term":"weigh","definition":"重达；称重。","highlight":"weigh"},{"term":"several hundred","definition":"数百。","highlight":"several hundred"}],"collocations":[{"term":"be found embedded in","definition":"被发现嵌在……中。"},{"term":"lumps of ambergris","definition":"龙涎香块。"},{"term":"weigh several hundred kilograms","definition":"重达数百公斤。"}],"difficult":["some of which 指前面的 lumps of ambergris，而不是 squid beaks。即“有些龙涎香块重达数百公斤”。"]},{"num":10,"english":"Melville took some delight in contrasting the origins of ambergris with the high value placed upon it by refined society:","chinese":"梅尔维尔颇有兴致地把龙涎香的这种来源，与上流社会赋予它的高昂价值作对比。","vocab":[{"term":"delight","definition":"愉快；乐趣。","highlight":"delight"},{"term":"contrast","definition":"对比。","highlight":"contrast"},{"term":"refined","definition":"有教养的；高雅的。这里 refined society 指上流/高雅社会。","highlight":"refined"}],"collocations":[{"term":"take delight in doing","definition":"以做……为乐；乐于做……。"},{"term":"contrast A with B","definition":"把 A 与 B 作对比。"},{"term":"place a high value on/upon","definition":"高度重视；赋予很高价值。"},{"term":"refined society","definition":"上流社会；讲究品位的社会群体。"}],"difficult":[]},{"num":11,"english":"Who would think, then, that such fine ladies and gentlemen should regale themselves with an essence found in the inglorious bowels of a sick whale!","chinese":"那么，谁能想到，如此体面的绅士淑女竟会享用一种来自病鲸不体面的肠腹之中的香精呢！","vocab":[{"term":"regale","definition":"使享受；款待；regale oneself with 指“享用”。","highlight":"regale"},{"term":"essence","definition":"香精；精华。","highlight":"essence"},{"term":"inglorious","definition":"不光彩的；不体面的。","highlight":"inglorious"},{"term":"bowels","definition":"肠；内脏。","highlight":"bowels"}],"collocations":[{"term":"regale oneself with","definition":"享用……；以……款待自己。"},{"term":"be found in","definition":"存在于/发现于……。"},{"term":"the bowels of","definition":"……的肠腹/内脏。"}],"difficult":["这是反问和讽刺，不是在询问信息。Melville 强调巨大反差：上流社会珍爱的高级香料，来源却是“病鲸的肠子”。"]}],"logic":"先介绍抹香鲸的体型和深潜能力 → 说明它捕食巨型乌贼 → 乌贼喙难以消化并刺激肠道 → 鲸产生黑色恶臭分泌物并偶尔吐出 → 物质离体后与空气接触，硬化并变成具有龙涎香特征的物质 → 最后用 Melville 的讽刺突出“来源粗鄙 vs 上流社会珍爱”的反差。","ielts":{"熟词僻义":["prey：名词“猎物”，不是“祈祷 pray”。","respond：不只是“回答”，也可表示身体/系统“作出反应”。","acquire：学术语境常表示“逐渐获得某种性质/特征”。","refined：这里不是“精炼过的”，而是“高雅的、有教养的”。"],"容易出现在判断题里的表达":["possibly as far as 3,000 metres：是“可能达到”，不是确定每次都能达到。","two hours or more：至少两小时，不能改成“最多两小时”。","It is not clear... whether...normal...or pathological：科学界并未确定是哪一种。","some of which can weigh several hundred kilograms：只有“其中一些”可重达数百公斤。"],"重要逻辑词":["It is from...that... 用强调形式指出真正来源。","but 表示科学上“不清楚性质”与“知道会被吐出”之间的转折。","Once 建立形成过程的时间顺序。","then 在 Melville 引语中承接前文形成讽刺。"],"高频同义替换":["be renowned for ≈ be famous/known for","in pursuit of ≈ while chasing / seeking","respond by producing ≈ react by producing","be exposed to air ≈ come into contact with air","acquire characteristics ≈ develop/take on characteristics","place a high value on ≈ value highly"]},"expressions":[{"expression":"be renowned for","meaning":"以……闻名","replacement":"be famous/known for"},{"expression":"in pursuit of","meaning":"为了追捕/追求……","replacement":"while chasing / seeking"},{"expression":"have problems in doing","meaning":"做……有困难","replacement":"have difficulty doing"},{"expression":"respond by doing","meaning":"通过做……作出反应","replacement":"react by doing"},{"expression":"from time to time","meaning":"不时；偶尔","replacement":"occasionally"},{"expression":"large quantities of","meaning":"大量的……","replacement":"a large amount of / large amounts of"},{"expression":"be exposed to","meaning":"暴露于；接触到","replacement":"come into contact with"},{"expression":"acquire the characteristics of","meaning":"获得……的特征","replacement":"develop/take on the characteristics of"},{"expression":"be embedded in","meaning":"嵌在……中","replacement":"be lodged in"},{"expression":"contrast A with B","meaning":"把 A 与 B 对比","replacement":"compare A and B to highlight differences"}],"memory":["be renowned for","in pursuit of","have problems in doing","respond by doing","it is not clear whether...","from time to time","large quantities of","be exposed to air","acquire the characteristics of","be embedded in","contrast A with B","place a high value on"]},{"letter":"E","sentences":[{"num":1,"english":"Sperm whales were ruthlessly pursued by commercial whalers in the 19th and 20th centuries.","chinese":"在 19 世纪和 20 世纪，商业捕鲸者曾对抹香鲸进行残酷而大规模的捕猎。","vocab":[{"term":"ruthlessly","definition":"无情地；残酷地。","highlight":"ruthlessly"},{"term":"pursue","definition":"追捕；追逐。","highlight":"pursue"},{"term":"commercial","definition":"商业的。","highlight":"commercial"},{"term":"whaler","definition":"捕鲸者；捕鲸船。","highlight":"whaler"}],"collocations":[{"term":"be ruthlessly pursued","definition":"遭到残酷追捕。"},{"term":"commercial whaling","definition":"商业捕鲸。"},{"term":"commercial whaler","definition":"商业捕鲸者。"}],"difficult":[]},{"num":2,"english":"In 1963-64 alone, almost 30 000 individuals were killed, and only the imposition of a ban on the hunting of sperm whales in 1984 saved the species from extinction.","chinese":"仅在 1963 至 1964 年间，就有近 3 万头抹香鲸被捕杀；直到 1984 年实施禁捕令，这一物种才免于灭绝。","vocab":[{"term":"individual","definition":"个体；在动物种群语境中可指“一只动物”。","highlight":"individual"},{"term":"imposition","definition":"实施；强制推行。","highlight":"imposition"},{"term":"ban","definition":"禁令。","highlight":"ban"},{"term":"species","definition":"物种。","highlight":"species"},{"term":"extinction","definition":"灭绝。","highlight":"extinction"}],"collocations":[{"term":"the imposition of a ban","definition":"实施禁令。"},{"term":"a ban on","definition":"对……的禁令。"},{"term":"save a species from extinction","definition":"使某物种免于灭绝。"},{"term":"the hunting of","definition":"对……的捕猎。"}],"difficult":["only the imposition of a ban... saved the species... 强调“正是/只有禁令的实施才挽救了该物种”。时间题中要区分 1963-64 的捕杀数字与 1984 的禁捕。"]},{"num":3,"english":"Ambergris was by far the most valuable product to be extracted during the processing of the whales' carcasses, and over 90 per cent of the annual worldwide total was acquired in this way, as a by-product of commercial whaling.","chinese":"在处理鲸尸体时提取出的各种产品中，龙涎香是迄今最有价值的一种；过去全球每年获得的龙涎香中，超过 90% 都是以这种方式取得的，即作为商业捕鲸的副产品。","vocab":[{"term":"by far","definition":"远远；显然，用于加强最高级。","highlight":"by far"},{"term":"extract","definition":"提取；取出。","highlight":"extract"},{"term":"processing","definition":"加工；处理。","highlight":"processing"},{"term":"carcass","definition":"动物尸体。","highlight":"carcass"},{"term":"annual","definition":"每年的。","highlight":"annual"},{"term":"by-product","definition":"副产品。","highlight":"by-product"}],"collocations":[{"term":"by far the most valuable","definition":"远远是最有价值的。"},{"term":"be extracted from/during","definition":"从……中/在……过程中被提取。"},{"term":"the annual worldwide total","definition":"全球年度总量。"},{"term":"be acquired in this way","definition":"以这种方式获得。"},{"term":"a by-product of","definition":"……的副产品。"}],"difficult":["over 90 per cent of the annual worldwide total 指“全球每年龙涎香总量的 90% 以上”，而不是“90% 的鲸”。数字归属是雅思阅读常见陷阱。"]},{"num":4,"english":"However, even before the ban on hunting sperm whales was imposed, the 1972 Marine Mammal Protection Act had prohibited trade in ambergris.","chinese":"然而，甚至在禁捕抹香鲸的禁令实施之前，1972 年的《海洋哺乳动物保护法》就已经禁止了龙涎香贸易。","vocab":[{"term":"impose","definition":"实施；强制实行。","highlight":"impose"},{"term":"prohibit","definition":"禁止。","highlight":"prohibit"},{"term":"trade","definition":"贸易；交易。","highlight":"trade"},{"term":"marine mammal","definition":"海洋哺乳动物。","highlight":"marine mammal"}],"collocations":[{"term":"a ban on hunting","definition":"捕猎禁令。"},{"term":"be imposed","definition":"被实施。"},{"term":"prohibit trade in","definition":"禁止……的贸易。"},{"term":"even before","definition":"甚至早在……之前。"}],"difficult":["had prohibit document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===btn));document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===btn.dataset.view)); if(btn.dataset.view==='study'&&!quiz.current) nextQuestion();}));

// ---------- bank ----------
function renderBank(q=''){const needle=q.trim().toLowerCase();const arr=DECK.filter(w=>!needle||w.term.toLowerCase().includes(needle)||w.definition.toLowerCase().includes(needle));refs.wordGrid.innerHTML=arr.map(w=>`<div class="wordcard"><div><span class="w">${esc(w.term)}</span><button class="mini-speak" type="button" data-say="${encodeURIComponent(stripTerm(w.term))}">🔊</button></div><div>${esc(w.definition)}</div><div class="subtle">Paragraph ${w.paragraph} · Sentence ${w.sentence}</div></div>`).join('')}
refs.wordSearch.addEventListener('input',()=>renderBank(refs.wordSearch.value));renderBank();

// ---------- quiz ----------
const STORE='ambergrisReviewV4';
function defaultState(){return {attempts:0,correct:0,wrong:0,words:{}}}
let state;try{state=JSON.parse(localStorage.getItem(STORE))||defaultState()}catch{state=defaultState()}
const quiz={mode:'listen-cn',paragraph:'ALL',current:null,revealed:false,graded:false,index:0,order:[]};
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch{} updateStats()}
function updateStats(){refs.attemptsStat.textContent=state.attempts||0;refs.correctStat.textContent=state.correct||0;refs.wrongStat.textContent=state.wrong||0;const pct=state.attempts?Math.round((state.correct||0)/state.attempts*100):0;refs.progressBar.style.width=pct+'%'}
function pool(){let p=DECK.filter(w=>quiz.paragraph==='ALL'||w.paragraph===quiz.paragraph);if(refs.wrongFirst.checked){const wrong=p.filter(w=>(state.words[normEn(w.term)]?.wrong||0)>0);if(wrong.length)p=wrong}return p}
function chooseWord(){const p=pool();if(!p.length)return null;if(refs.shuffleMode.checked)return p[Math.floor(Math.random()*p.length)];quiz.index=(quiz.index+1)%p.length;return p[quiz.index]}
function modeText(){return ({'listen-cn':'听英写中','cn-en':'看中拼英','listen-en':'听音拼英'})[quiz.mode]}
function renderPrompt(){const w=quiz.current;if(!w){refs.promptCard.innerHTML='<div>没有可用词汇。</div>';return}if(quiz.mode==='cn-en'){refs.promptCard.innerHTML=`<div class="prompt-inner"><div class="kicker">中文提示</div><div class="cn-prompt">${esc(w.definition)}</div><div class="prompt-title">根据中文，拼出对应英文</div><div class="prompt-help">这一模式不会自动播放发音，避免额外提示。</div><div class="source-hint">Paragraph ${w.paragraph} · Sentence ${w.sentence}</div></div>`}else{const t=quiz.mode==='listen-cn'?'听英文发音，写出中文意思':'只凭发音，拼出英文单词';const h=quiz.mode==='listen-cn'?'写出核心意思即可；核对后由你自评。':'屏幕不会显示中文或英文，这是纯听音拼写。';refs.promptCard.innerHTML=`<div class="prompt-inner"><div class="kicker">${quiz.mode==='listen-cn'?'听音辨义':'Spelling Dictation'}</div><button class="listen-orb" type="button" id="promptSpeak" aria-label="播放当前单词">🔊</button><div class="listen-status"></div><div class="prompt-title">${t}</div><div class="prompt-help">${h}</div><div class="source-hint">Paragraph ${w.paragraph} · Sentence ${w.sentence}</div></div>`;$('promptSpeak').addEventListener('click',speakCurrent)}}
function configureAnswer(){const chinese=quiz.mode==='listen-cn';refs.answerInput.value='';refs.answerInput.style.minHeight=chinese?'88px':'54px';refs.answerInput.rows=chinese?3:1;refs.answerLabel.textContent=chinese?'写出中文意思':'拼写英文单词';refs.answerInput.placeholder=chinese?'例如：芳香的；有香味的':'请输入英文拼写，例如：aromatic';refs.replayBtn.style.display=quiz.mode==='cn-en'?'none':'inline-block';refs.selfGrade.classList.remove('show');refs.feedback.className='feedback';refs.feedback.innerHTML='';refs.checkBtn.disabled=false;refs.revealBtn.disabled=false}
function nextQuestion(){quiz.current=chooseWord();quiz.revealed=false;quiz.graded=false;refs.modeBadge.textContent=modeText();renderPrompt();configureAnswer();if(quiz.current){refs.qMeta.textContent=`Paragraph ${quiz.current.paragraph} · Sentence ${quiz.current.sentence}`;refs.deckMeta.textContent=`当前词库 ${pool().length} 词`;if(refs.autoSpeak.checked&&quiz.mode!=='cn-en')setTimeout(speakCurrent,160);setTimeout(()=>refs.answerInput.focus(),100)}}
function speakCurrent(){if(quiz.current)speak(stripTerm(quiz.current.term))}
function feedbackHTML(prefix){const w=quiz.current;return `<div>${prefix}</div><div class="ans-word">${esc(w.term)}</div><div class="ans-cn">${esc(w.definition)}</div><div class="example">原句位置：Paragraph ${w.paragraph} · Sentence ${w.sentence}</div>`}
function revealAnswer(kind='neutral'){if(!quiz.current)return;quiz.revealed=true;refs.feedback.className='feedback show '+kind;refs.feedback.innerHTML=feedbackHTML(kind==='good'?'✓ 正确':'答案');refs.revealBtn.disabled=true}
function record(isCorrect){if(quiz.graded)return;quiz.graded=true;const key=normEn(quiz.current.term);state.words[key]??={correct:0,wrong:0};state.attempts++;if(isCorrect){state.correct++;state.words[key].correct++}else{state.wrong++;state.words[key].wrong++}save()}
function checkAnswer(){if(!quiz.current)return;const val=refs.answerInput.value.trim();if(!val){toast('先输入答案');refs.answerInput.focus();return}if(quiz.mode==='listen-cn'){revealAnswer('neutral');refs.feedback.innerHTML=feedbackHTML('请对照答案，自评你的中文释义是否抓住核心意思：');refs.selfGrade.classList.add('show');refs.checkBtn.disabled=true;return}const ok=normEn(val)===normEn(quiz.current.term);record(ok);refs.feedback.className='feedback show '+(ok?'good':'bad');refs.feedback.innerHTML=feedbackHTML(ok?'✓ 拼写正确':'✗ 拼写不对，再看一次');refs.checkBtn.disabled=true;refs.revealBtn.disabled=true}
function selfGrade(ok){record(ok);refs.selfGrade.classList.remove('show');refs.feedback.className='feedback show '+(ok?'good':'bad');refs.feedback.innerHTML=feedbackHTML(ok?'✓ 已标记：记住了':'↺ 已加入需复习词');}
function setMode(mode,button){quiz.mode=mode;document.querySelectorAll('.mode-card').forEach(x=>x.classList.toggle('active',x===button));nextQuestion()}
refs.modeGrid.addEventListener('click',(e)=>{const b=e.target.closest('.mode-card');if(b)setMode(b.dataset.mode,b)});
document.querySelector('.filters').addEventListener('click',(e)=>{const b=e.target.closest('[data-paragraph]');if(!b)return;document.querySelectorAll('[data-paragraph]').forEach(x=>x.classList.toggle('active',x===b));quiz.paragraph=b.dataset.paragraph;quiz.index=-1;nextQuestion()});
refs.checkBtn.addEventListener('click',checkAnswer);refs.replayBtn.addEventListener('click',speakCurrent);refs.revealBtn.addEventListener('click',()=>{if(quiz.mode==='listen-cn'){revealAnswer('neutral');refs.selfGrade.classList.add('show');refs.checkBtn.disabled=true}else{record(false);refs.feedback.className='feedback show bad';refs.feedback.innerHTML=feedbackHTML('答案');refs.checkBtn.disabled=true;refs.revealBtn.disabled=true}});refs.nextBtn.addEventListener('click',nextQuestion);refs.selfGood.addEventListener('click',()=>selfGrade(true));refs.selfBad.addEventListener('click',()=>selfGrade(false));refs.wrongFirst.addEventListener('change',nextQuestion);refs.shuffleMode.addEventListener('change',nextQuestion);refs.resetBtn.addEventListener('click',()=>{if(confirm('确定清除当前浏览器里的所有复习记录吗？')){state=defaultState();save();nextQuestion();toast('复习记录已重置')}});
refs.answerInput.addEventListener('keydown',(e)=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(quiz.mode==='listen-cn'&&refs.selfGrade.classList.contains('show'))return;if(refs.checkBtn.disabled)nextQuestion();else checkAnswer()}});
updateStats();

// ---------- self test for headless verification ----------
window.__ambergrisApp={refs,quiz,nextQuestion,setMode,checkAnswer,normEn};
if(new URLSearchParams(location.search).get('selftest')==='1'){
  refs.autoSpeak.checked=false;
  document.querySelector('[data-view="study"]').click();
  const b2=document.querySelector('[data-mode="cn-en"]');b2.click();
  const cnVisible=refs.promptCard.textContent.includes(quiz.current.definition.slice(0,2));
  refs.answerInput.value=stripTerm(quiz.current.term);refs.checkBtn.click();
  const spellingWorks=refs.feedback.classList.contains('show');
  const b3=document.querySelector('[data-mode="listen-en"]');b3.click();
  const noCn=!refs.promptCard.textContent.includes(quiz.current.definition.slice(0,2));
  const result=document.createElement('div');result.id='SELFTEST_RESULT';result.textContent=JSON.stringify({cnVisible,spellingWorks,noCn,mode:quiz.mode,hasCurrent:!!quiz.current});document.body.appendChild(result);
}
})();
</script>
</body></html>
